name: Build Pirate Cribbage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent932-pirate-cribbage/**"
      - ".github/workflows/build-pirate-cribbage.yml"
  push:
    branches: [main]
    paths:
      - "agent932-pirate-cribbage/**"
      - ".github/workflows/build-pirate-cribbage.yml"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pirate-cribbage

defaults:
  run:
    working-directory: agent932-pirate-cribbage

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: agent932-pirate-cribbage/.nvmrc
          cache: npm
          cache-dependency-path: agent932-pirate-cribbage/package-lock.json
      # Umbrel only pulls a new image when docker-compose.yml changes, so the compose file pins an exact
      # image: the release's version tag, or (e.g. to ship an already-built image) its sha- tag.
      - name: Compose image tag matches the app version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' umbrel-app.yml)
          grep -qE "image: ghcr.io/agent932/pirate-cribbage:($version|sha-[0-9a-f]{40})$" docker-compose.yml \
            || { echo "docker-compose.yml must pin pirate-cribbage:$version (or an exact sha- build), never :latest"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Real browsers (Chromium, and WebKit on an iPhone-sized screen) playing the production build.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: agent932-pirate-cribbage/.nvmrc
          cache: npm
          cache-dependency-path: agent932-pirate-cribbage/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - name: Keep the report, screenshots and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            agent932-pirate-cribbage/playwright-report
            agent932-pirate-cribbage/test-results
          retention-days: 14

  image:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the app version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' umbrel-app.yml)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: agent932-pirate-cribbage
          file: agent932-pirate-cribbage/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          # Links the package to this repo so it shows up here and can inherit its visibility.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
