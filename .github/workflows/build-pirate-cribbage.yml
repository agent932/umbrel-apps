name: Build Pirate Cribbage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent932-pirate-cribbage/**"
      - ".github/workflows/build-pirate-cribbage.yml"
  push:
    branches: [main]
    paths:
      - "agent932-pirate-cribbage/**"
      - ".github/workflows/build-pirate-cribbage.yml"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pirate-cribbage

defaults:
  run:
    working-directory: agent932-pirate-cribbage

jobs:
  test:
    runs-on: ubuntu-24.04
    # A real Postgres for the doubloon and shop races (races.pg.test.ts): the tests' in-memory
    # database runs one transaction at a time, so it can't catch a missing lock.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pirate
          POSTGRES_PASSWORD: pirate
          POSTGRES_DB: pirate_cribbage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pirate -d pirate_cribbage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pirate:pirate@localhost:5432/pirate_cribbage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: agent932-pirate-cribbage/.nvmrc
          cache: npm
          cache-dependency-path: agent932-pirate-cribbage/package-lock.json
      # Umbrel only pulls a new image when docker-compose.yml changes, so the compose file pins an exact
      # image: the release's version tag, or (e.g. to ship an already-built image) its sha- tag.
      - name: Compose image tag matches the app version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' umbrel-app.yml)
          grep -qE "image: ghcr.io/agent932/pirate-cribbage:($version|sha-[0-9a-f]{40})$" docker-compose.yml \
            || { echo "docker-compose.yml must pin pirate-cribbage:$version (or an exact sha- build), never :latest"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Real browsers playing the production build: Chromium on a desktop and WebKit on an
  # iPhone-sized screen, on three machines side by side: the whole games (tagged @game, played in
  # Chromium only), the rest of Chromium, and the iPhone. The two Chromium machines split the
  # project with the same tag, so every Chromium test runs on one of them.
  # Each machine runs Playwright's default two workers: three games at once on four cores would
  # slow each other, and the pirate game alone takes about as long as the other two together.
  e2e:
    name: e2e (${{ matrix.machine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: chromium-games
            project: chromium
            tests: --grep @game
          - machine: chromium
            project: chromium
            tests: --grep-invert @game
          # Its whole project: the whole games skip themselves on the iPhone.
          - machine: iphone
            project: iphone
            tests: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: agent932-pirate-cribbage/.nvmrc
          cache: npm
          cache-dependency-path: agent932-pirate-cribbage/package-lock.json
      - run: npm ci
      # Not cached: most of this step is the browser's system packages, which a cache can't hold.
      - run: npx playwright install --with-deps ${{ matrix.project == 'iphone' && 'webkit' || 'chromium' }}
      # The shop-closed setup project runs first, in this machine's browser. The --grep doesn't
      # reach it: Playwright runs a project's dependencies in full.
      - run: npm run e2e -- --project=${{ matrix.project }} ${{ matrix.tests }}
        env:
          E2E_DEVICE: ${{ matrix.project }}
      - name: Keep the report, screenshots and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.machine }}
          path: |
            agent932-pirate-cribbage/playwright-report
            agent932-pirate-cribbage/test-results
          retention-days: 14

  image:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the app version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' umbrel-app.yml)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: agent932-pirate-cribbage
          file: agent932-pirate-cribbage/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          # Links the package to this repo so it shows up here and can inherit its visibility.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
