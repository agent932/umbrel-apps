version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: agent932-pirate-cribbage_web_1
      APP_PORT: 3000
      # The game has its own player accounts and is meant to be shared with
      # friends, so skip the Umbrel login.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/agent932/pirate-cribbage:0.33.1
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - database
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://pirate:${APP_PIRATE_CRIBBAGE_DB_PASSWORD}@database:5432/pirate_cribbage
      - SESSION_SECRET=${APP_PIRATE_CRIBBAGE_SESSION_SECRET}
      - MIGRATE_ON_START=true

  database:
    image: postgres:17-alpine
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - POSTGRES_DB=pirate_cribbage
      - POSTGRES_USER=pirate
      - POSTGRES_PASSWORD=${APP_PIRATE_CRIBBAGE_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data

  # Nightly database backup: a compressed dump into the app's data folder, keeping the last 14.
  # Restoring: see docs/backups.md.
  backup:
    image: postgres:17-alpine
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      - database
    environment:
      - PGPASSWORD=${APP_PIRATE_CRIBBAGE_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 120
        while true; do
          file=/backups/pirate_cribbage-$$(date +%F).dump
          if pg_dump -h database -U pirate -d pirate_cribbage -Fc -f "$$file.part"; then
            mv "$$file.part" "$$file"
            ls -1t /backups/pirate_cribbage-*.dump | tail -n +15 | xargs -r rm -f
          else
            rm -f "$$file.part"
          fi
          sleep 86400
        done
