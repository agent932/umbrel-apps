manifestVersion: 1
id: agent932-pirate-cribbage
category: gaming
name: Deckhand Games
version: "0.30.2"
tagline: Self-hosted card games with friends, starting with Pirate Cribbage
icon: https://raw.githubusercontent.com/agent932/umbrel-apps/main/agent932-pirate-cribbage/assets/agent932-pirate-cribbage.png
description: >-
  Deckhand Games is a self-hosted home for card games you play with friends.
  One account, one friends list and one Ship's Log carry across every game.
  The first game aboard is Pirate Cribbage, with more on the way.


  Pirate Cribbage: play classic cribbage, or switch on Pirate Rules for six
  sneaky powers and buried treasure. Play the computer crew (Easy, Medium,
  Hard) or friends online, and track detailed stats for every match: win
  rates, pegging, hand and crib averages, hand distributions and a discard
  analyzer.


  Playing with friends outside your home network: the app has its own
  player accounts, so it is published without the Umbrel login in front of it.
  Point a Cloudflare Tunnel (or Tailscale) at port 8121 to let friends join.


  Features:

  - Player accounts, friends and avatars

  - Play the computer crew or friends online, with emotes and rematches

  - Ranked play with tiers, achievements and a daily discard puzzle

  - Detailed per-mode and head-to-head stats

  - Optional email (via Resend) for invites, password resets and notices

  - Daily database backups
releaseNotes: >-
  In Pirate games on phones, your opponent's portrait and powers no longer
  cover the board, and on smaller phones everything on the table stays clear
  of your cards. Also includes the last-card and layout fixes from 0.30.1.


